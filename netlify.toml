[build]
  command = "npm run build:netlify && node netlify-image-fix.js"
  publish = "dist"
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF ./public/"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  included_files = ["netlify/functions/node_modules/**"]

# Ensure all assets are copied to the dist folder
[build.processing]
  skip_processing = false

[build.processing.images]
  compress = true

[build.environment]
  NODE_VERSION = "20"

# Exclude Google verification file from SPA redirect
[[redirects]]
  from = "/googlea7b0d1994a9c267c.html"
  to = "/googlea7b0d1994a9c267c.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = """
      default-src 'self';
      script-src 'self' https: 'unsafe-inline' 'unsafe-eval' blob:;
      style-src 'self' https: 'unsafe-inline';
      img-src 'self' data: https: blob:;
      font-src 'self' data: https:;
      connect-src 'self' https: wss: ws:;
      media-src 'self' https:;
      object-src 'none';
      frame-src 'self' https://js.stripe.com https://hooks.stripe.com;
      worker-src 'self' blob:;
      child-src 'self' blob:;
      form-action 'self';
      base-uri 'self';
      manifest-src 'self';
    """
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

# Add cache control for images
[[headers]]
  for = "*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.PNG"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/favicon*.png"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/favicon.ico"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/apple-touch-icon.png"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=3600"
    Content-Type = "application/manifest+json"